<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Jhurine 💙</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      padding: 20px;
      position: relative;
    }

    /* Floating Background Elements */
    .icon {
      position: absolute;
      font-size: 2rem;
      user-select: none;
      animation: float 6s ease-in-out infinite alternate;
      z-index: 1;
    }

    .icon-1 { top: 10%; left: 8%; animation-delay: 0s; }
    .icon-2 { top: 20%; right: 10%; animation-delay: 1.5s; }
    .icon-3 { bottom: 25%; left: 5%; animation-delay: 3s; }
    .icon-4 { bottom: 10%; left: 12%; animation-delay: 0.8s; }
    .icon-5 { bottom: 15%; right: 8%; animation-delay: 2.2s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-15px) rotate(8deg); }
    }

    /* Message Card Container */
    .card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 10;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #4cc9f0;
      text-shadow: 0 0 10px rgba(76, 201, 240, 0.4);
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0e1dd;
      margin-bottom: 25px;
    }

    /* Play Button */
    .play-btn {
      background: rgba(76, 201, 240, 0.15);
      border: 1px solid #4cc9f0;
      color: #4cc9f0;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(76, 201, 240, 0.3);
      transition: all 0.3s ease;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(76, 201, 240, 0.7);
      background: rgba(76, 201, 240, 0.3);
    }
  </style>
</head>
<body>

  <!-- Floating Background Elements -->
  <div class="icon icon-1">🐻</div>
  <div class="icon icon-2">🧸</div>
  <div class="icon icon-3">⭐</div>
  <div class="icon icon-4">🍬</div>
  <div class="icon icon-5">🐰</div>

  <!-- Message Card -->
  <div class="card">
    <h1>Happy Birthday, Jhurine! 🎉</h1>
    <p>
      Write your birthday message here! You can add multiple paragraphs or custom text inside this box.
    </p>

    <!-- Music Button -->
    <button id="playBtn" class="play-btn" onclick="toggleAudio()">► Play Music</button>
  </div>

  <!-- Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="yung_kai_blue_official_music_video.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function toggleAudio() {
      const music = document.getElementById("bgMusic");
      const btn = document.getElementById("playBtn");

      if (music.paused) {
        music.play().then(() => {
          btn.innerText = "❚❚ Pause Music";
        }).catch(error => {
          console.log("Audio play error:", error);
        });
      } else {
        music.pause();
        btn.innerText = "► Play Music";
      }
    }
  </script>

</body>
</html>
