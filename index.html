<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Jhurine 💙</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Background Elements */
    .icon {
      position: absolute;
      font-size: 2rem;
      user-select: none;
      animation: float 6s ease-in-out infinite alternate;
    }

    .icon-1 { top: 15%; left: 10%; animation-delay: 0s; }
    .icon-2 { top: 25%; right: 12%; animation-delay: 1.5s; }
    .icon-3 { bottom: 35%; left: 5%; animation-delay: 3s; }
    .icon-4 { bottom: 15%; left: 12%; animation-delay: 0.8s; }
    .icon-5 { bottom: 20%; right: 10%; animation-delay: 2.2s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-15px) rotate(8deg); }
    }

    /* Central Content */
    .content {
      text-align: center;
      z-index: 10;
    }

    h1 {
      color: #ffffff;
      font-size: 2.2rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(76, 201, 240, 0.5);
    }

    /* Play Button */
    .play-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #4cc9f0;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(67, 97, 238, 0.4);
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(76, 201, 240, 0.8);
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- Floating Background Elements -->
  <div class="icon icon-1">🐻</div>
  <div class="icon icon-2">🧸</div>
  <div class="icon icon-3">⭐</div>
  <div class="icon icon-4">🍬</div>
  <div class="icon icon-5">🐰</div>

  <!-- Page Content -->
  <div class="content">
    <button id="playBtn" class="play-btn" onclick="toggleAudio()">► Play</button>
  </div>

  <!-- Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="yung_kai_blue_official_music_video.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function toggleAudio() {
      const music = document.getElementById("bgMusic");
      const btn = document.getElementById("playBtn");

      if (music.paused) {
        music.play().then(() => {
          btn.innerText = "❚❚ Pause";
        }).catch(error => {
          console.log("Audio play error:", error);
        });
      } else {
        music.pause();
        btn.innerText = "► Play";
      }
    }
  </script>

</body>
</html>
