<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
      color: #333;
    }

    .container {
      text-align: center;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 15px;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Happy Birthday! 🎉</h1>
    <p>Click below to play the background music:</p>

    <!-- Audio Element -->
    <audio id="bgMusic" loop preload="auto">
      <source src="yung_kai_blue_official_music_video.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- Music Control Button -->
    <button id="playBtn" onclick="toggleAudio()">Play Music 🎵</button>
  </div>

  <script>
    function toggleAudio() {
      const music = document.getElementById("bgMusic");
      const btn = document.getElementById("playBtn");

      if (music.paused) {
        music.play();
        btn.innerText = "Pause Music ⏸️";
      } else {
        music.pause();
        btn.innerText = "Play Music 🎵";
      }
    }
  </script>

</body>
</html>
